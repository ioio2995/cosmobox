[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmobox"
version = "0.1.0"
description = "Substrat quantique relationnel: modele de jauge fini (niveau 0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cosmobox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
